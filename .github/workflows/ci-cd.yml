name: CI/CD Pipeline for Flask App

on:
  push:
    branches:
      - main
      - staging
  release:
    types: [created]

jobs:
  # Job 1: Install dependencies, run tests, build
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pip install pytest
          pytest test_app.py --maxfail=1 --disable-warnings

      - name: Build (Prepare for deployment)
        run: |
          echo "Build step completed. Application ready for packaging."
          mkdir -p build_output
          cp -r . build_output/
          echo "Build output prepared in build_output/"

  # Job 2: Deploy to Staging (only on push to staging branch)
  deploy-staging:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging Environment
        env:
          STAGING_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          echo "Deploying to staging server..."
          echo "Staging deployment successful using key: ${STAGING_KEY:0:4}..."

  # Job 3: Deploy to Production (only on release creation)
  deploy-production:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Environment
        env:
          PROD_TOKEN: ${{ secrets.PROD_API_TOKEN }}
        run: |
          echo "Deploying to production server..."
          echo "Production deployment successful using token: ${PROD_TOKEN:0:4}..."

